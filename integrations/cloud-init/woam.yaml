#cloud-config
# Install woam at provision time and take the first baseline.
#
# Keep this SMALL. It gets merged into a larger user_data document, and the
# cloud provider caps user_data at 65,535 base64 characters. A deploy template
# that is already near the cap and silently goes over it fails at server-create,
# before a VM exists, which does not look like a cloud-init problem at all.
#
# runcmd is correct here even though runcmd does not survive a reboot: installing
# a binary is a one-time act. Anything that must be true on EVERY boot belongs in
# a systemd unit instead.

write_files:
  # The pointer. It carries no state, only the invariant, so it can never go
  # stale and can be copied anywhere.
  - path: /etc/profile.d/woam.sh
    permissions: '0755'
    content: |
      # Printed on every login. Only invariants: no ports, no IPs, no status,
      # because nothing regenerates this file.
      command -v woam >/dev/null 2>&1 && woam status 2>/dev/null | head -3

runcmd:
  - [ sh, -c, 'curl -fsSL https://redu.cloud/woam-install.sh | sh' ]
